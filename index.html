<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Horta - Blogs dos Alunos</title>
    <style>
        :root {
            --cor-principal: #2e7d32;
            --cor-fundo: #f4f6f4;
            --cor-card: #ffffff;
            --cor-texto: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            line-height: 1.6;
        }

        header {
            background-color: var(--cor-principal);
            color: white;
            text-align: center;
            padding: 2.5rem 1rem;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid-alunos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .card-aluno {
            background: var(--cor-card);
            border-radius: 10px;
            padding: 1.8rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-top: 5px solid var(--cor-principal);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card-aluno:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.12);
        }

        .card-aluno h2 {
            color: var(--cor-principal);
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .card-aluno p {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .btn-acessar {
            display: inline-block;
            text-align: center;
            background-color: var(--cor-principal);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .btn-acessar:hover {
            background-color: #1b5e20;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Projeto Horta</h1>
        <p>Acompanhe os blogs dos alunos do projeto</p>
    </header>

    <main>
        <section class="grid-alunos">
            
            <!-- Card Blog Rafael Moreira -->
            <article class="card-aluno">
                <div>
                    <h2>Blog da Horta</h2>
                    <p>Aluno: Rafael Moreira</p>
                </div>
                <a href="https://santosgodoymaria-source.github.io/blog-horta/" target="_blank" rel="noopener noreferrer" class="btn-acessar">
                    Acessar Blog do Rafael
                </a>
            </article>

            <!-- Card Blog Maria Eduarda Godoy Santos -->
            <article class="card-aluno">
                <div>
                    <h2>Horta da Maria</h2>
                    <p>Aluna: Maria Eduarda Godoy Santos</p>
                </div>
                <a href="https://santosgodoymaria-source.github.io/horta-da-Maria/" target="_blank" rel="noopener noreferrer" class="btn-acessar">
                    Acessar Blog da Maria
                </a>
            </article>

        </section>
    </main>

    <footer>
        <p>Projeto Horta • GitHub Pages</p>
    </footer>

</body>
</html>
